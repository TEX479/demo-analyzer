[package]
name = "analysis-template"
version = "0.1.0"
edition = "2024"
default-run = "cli"
# include = [ "src/", "build.rs" ]

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true # "thin"
codegen-units = 16
opt-level = 3

[profile.dist]
inherits = "release"
codegen-units = 1
lto = "fat"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.98"
bitbuffer = "0.11.1"
getopts = "0.2.23"
itertools = "0.14.0"
lazy_static = "1.5.0"
num_cpus = "1.16"
opener = "0.8.2"
rfd = { version = "0.15.3" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
steamid-ng = "1.0.0"
tf-demo-parser = "0.6.4"
web-time = "1.1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
lzma-rs = "0.3"

eframe = { version = "0.31.1", optional = true }
egui = { version = "0.31.1", optional = true }
notify = { version = "8.2.0", optional = true }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
steamlocate = { version = "2.1.0", optional = true }
rayon = { version = "1.12.0", optional = true }

[features]
# default = [ "all" ]
# default = [ "live_analyzer" ]
all = [ "gui", "live_analyzer", "bulk_analyzer", "rcon", "static_algorithms_module" ]
gui = [ "eframe", "egui" ]
live_analyzer = [ "notify", "steamlocate" ]
bulk_analyzer = [ "steamlocate", "rayon" ]
rcon = [ "gui" ]
experimental = []
parallel = [ "rayon" ]
static_algorithms_module = []
has_experimental_exclusions = []

[[bin]]
name = "gui"
required-features = [ "gui" ]

[[bin]]
name = "live_analyzer"
required-features = [ "live_analyzer" ]

[[bin]]
name = "bulk_analyzer"
required-features = [ "bulk_analyzer" ]

[lints.clippy]
panic = "deny"
todo = "warn"
unwrap_used = "deny"
